name: schema
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: write
on:
  push:
    branches: main
  pull_request:
    branches: null
jobs:
  build:
    name: build - x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: x86_64-unknown-linux-gnu-cargo-ubuntu-latest
      - name: Build
        run: cargo run -p oxvg --example schema -F jsonschema --verbose --locked
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: oxvg.json
          path: schema/oxvg.json
          if-no-files-found: error
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: oxvg_optimiser.json
          path: schema/oxvg_optimiser.json
          if-no-files-found: error
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: ls -R artifacts
        shell: bash
      - name: Publish eligiblity
        id: release_check
        run: |
          MSG="$(git log -1 --pretty=%B)"
          TAG="$(git tag --points-at HEAD | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$' | head -n1 || true)"
          if [[ "${{ github.ref }}" == "refs/heads/main" && "$MSG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ && -n "$TAG" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Upload release assets
        if: steps.release_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_check.outputs.tag }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
