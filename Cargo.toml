[workspace]
resolver = "2"
members = ["crates/*", "packages/wasm", "packages/napi", "packages/jsx"]

[workspace.lints.rust]
missing_docs = { level = "warn" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Willing to accept lossy conversions
cast_lossless = "allow"
# Willing to accept lossy conversions
cast_possible_truncation = "allow"
# dbg should only be used for debugging
dbg_macro = "warn"
# Not a priority for svgo parity
float_cmp = "allow"
# Too noisy and not really an issue
must_use_candidate = "allow"

[workspace.package]
authors = ["Noah <noahwbaldwin@gmail.com>"]
license = "MIT"
repository = "https://github.com/noahbald/oxvg"
readme = "readme.md"
edition = "2024"

[workspace.dependencies]
oxvg = { path = "crates/oxvg" }
oxvg_actions = { path = "crates/oxvg_actions", version = ">=0.0" }
oxvg_ast = { path = "crates/oxvg_ast", version = ">=0.0" }
oxvg_collections = { path = "crates/oxvg_collections", version = ">=0.0" }
oxvg_diagnostics = { path = "crates/oxvg_diagnostics", version = ">=0.0" }
oxvg_jsx = { path = "crates/oxvg_jsx", version = ">=0.0" }
oxvg_lint = { path = "crates/oxvg_lint", version = ">=0.0" }
oxvg_optimiser = { path = "crates/oxvg_optimiser", default-features = false, version = ">=0.0" }
oxvg_path = { path = "crates/oxvg_path", version = ">=0.0" }
oxvg_parse = { path = "crates/oxvg_parse", version = ">=0.0" }
oxvg_serialize = { path = "crates/oxvg_serialize", version = ">=0.0" }

anyhow = "1.0"
bitflags = { version = "2.7.0" }
bytecount = { version = "0.6" }
cfg-if = { version = "1.0" }
clap = { version = "4.5", features = ["derive"] }
cssparser = "0.37"
dashmap = "6.1"
derive_more = "2.0"
derive-where = "1.2"
geo = "0.33"
geo-types = { version = "0.7" }
getrandom = "0.4"
i_float = "3.0"
i_overlay = "7.0"
i_shape = "3.0"
itertools = "0.15"
js-sys = { version = "0.3" }
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = [
  "visitor",
] }
log = { version = "0.4" }
ls-types = "0.0.6"
napi = { version = "3.8", default-features = false, features = ["napi7"] }
napi-build = { version = "2.2", default-features = false }
napi-derive = { version = "3.3" }
num-traits = "0.2"
nunny = "0.2"
oxc_ast = "0.142"
paste = "1.0"
phf = { version = "0.14", features = ["macros"] }
precomputed-hash = "0.1"
rayon = "1.11"
rcdom = { package = "markup5ever_rcdom", version = "0.36.0" }
regex = "1.11"
robust = "1.2"
roxmltree = "0.21"
rstar = "0.12"
schemars = { version = "1.2.1" }
selectors = "0.39"
serde = "1.0"
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
serde_with = "3.15"
smallvec = "1.13.2"
string_cache = "0.10"
swc_core = "75.0"
swc_ecma_lexer = "42.0"
tendril = "0.5"
tokio = "1.48"
tower-lsp-server = "0.23"
tsify = { version = "0.5", default-features = false, features = ["js"] }
typed-arena = "2.0"
urlencoding = "2.1"
wasm-bindgen = "=0.2.104"
web-sys = { version = "0.3" }
xml5ever = "0.39"

# Developer dependencies
ctor = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }
env_logger = "0.11"
insta = "1.42"
pretty_assertions = "1.4"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.oxvg_wasm]
debug = true

[profile.test.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

[profile.release]
lto = true

[profile.release.package.oxvg_napi]
strip = "symbols"

[profile.release.package.oxvg_jsx_napi]
strip = "symbols"

[profile.release.package.oxvg_wasm]
strip = true
